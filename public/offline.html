<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Açaí de Casa</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      .card {
        max-width: 28rem;
      }
      .badge {
        display: inline-flex;
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 1rem;
        background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 1.25rem;
        box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.4);
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #475569;
        line-height: 1.55;
        margin: 0 0 1.5rem;
      }
      button {
        background: #7c3aed;
        color: white;
        border: 0;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #6d28d9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge" aria-hidden="true">AC</div>
      <h1>Sem conexão</h1>
      <p>
        Você está offline. As páginas já visitadas continuam disponíveis pelo cache, mas
        para criar ou alterar dados você precisa de internet.
      </p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
